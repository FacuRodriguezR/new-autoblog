<header class="bg-azulAs w-full fixed z-[1000] transition-transform duration-300" [class.translate-y-0]="showHeader"
    [class.-translate-y-full]="!showHeader">
    <nav class="container mx-auto px-6 py-5">
        <div class="flex items-center justify-between">
            <div class="text-white font-bold text-xl">
                <a routerLink="home"><img src="assets/images/icons/autoblog2.svg" alt="" width="180px"></a>
            </div>
            <div class="hidden md:block">
                <ul class="flex items-center space-x-8">
                    <li><a routerLink="/tips" class="text-white hover:text-gray-300 transition">Consejos útiles</a></li>
                    <li><a routerLink="events" class="text-white hover:text-gray-300 transition">Eventos</a></li>
                    <li><a routerLink="mcdonalds" class="text-white hover:text-gray-300 transition">Novedades</a></li>
                    <li><a routerLink="benefits" class="text-white hover:text-gray-300 transition">Promociones y
                            Beneficios</a></li>
                </ul>
            </div>
            <div class="md:hidden">
                <button class="outline-none mobile-menu-button" (click)="toggleMenu()">
                    <svg class="w-6 h-6 text-white" fill="none" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                        <path d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Menú Móvil Centrado -->
        <div class="mobile-menu md:hidden transition-all duration-300" [class.hidden]="!showMobileMenu">
            <ul class="mt-4 pt-4 pb-2 space-y-2 border-t border-white/10 flex flex-col items-center w-full">
                <li class="w-full">
                    <a routerLink="/tips" (click)="closeMenu()"
                        class="block w-full text-center px-4 py-2 text-white hover:bg-white/10 rounded transition">
                        Consejos útiles
                    </a>
                </li>
                <li class="w-full">
                    <a routerLink="events" (click)="closeMenu()"
                        class="block w-full text-center px-4 py-2 text-white hover:bg-white/10 rounded transition">
                        Eventos
                    </a>
                </li>
                <li class="w-full">
                    <a routerLink="mcdonalds" (click)="closeMenu()"
                        class="block w-full text-center px-4 py-2 text-white hover:bg-white/10 rounded transition">
                        Novedades
                    </a>
                </li>
                <li class="w-full">
                    <a routerLink="benefits" (click)="closeMenu()"
                        class="block w-full text-center px-4 py-2 text-white hover:bg-white/10 rounded transition">
                        Promociones y Beneficios
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>
