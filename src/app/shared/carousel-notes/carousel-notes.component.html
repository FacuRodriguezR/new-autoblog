<div class="relative w-full group overflow-hidden p-2" (mouseenter)="stopAutoPlay()" (mouseleave)="startAutoPlay()">

    <button (click)="scroll('left')"
        class="hidden lg:flex absolute left-4 top-1/2 -translate-y-1/2 z-10 bg-black/40 hover:bg-black/70 backdrop-blur-sm p-3 rounded-full text-white transition-all duration-300 opacity-0 group-hover:opacity-100 shadow-xl">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
    </button>

    <div #container class="flex overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar gap-6 p-6 lg:p-10">

        @for(note of notesCarousel(); track note.id) {
        <div [routerLink]="['/', tipoCarousel(), note.slug]" class="snap-start flex-shrink-0 relative group/card cursor-pointer overflow-hidden rounded-xl shadow-lg hover:shadow-2xl transition-all duration-500 bg-black 
                    w-[85%] sm:w-[45%] lg:w-[31%] aspect-video">

            <img [src]="note.image" [alt]="note.title"
                class="w-full h-full object-cover opacity-85 group-hover/card:opacity-100 group-hover/card:scale-105 transition-all duration-700" />

            <div
                class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent 
                        flex flex-col justify-end p-6 lg:p-8 transition-all duration-500 group-hover/card:via-black/70">

                <h3 class="text-[17px] lg:text-[20px] font-bold text-white leading-tight drop-shadow-lg
                           line-clamp-2 group-hover/card:line-clamp-none transition-all duration-500">
                    {{ note.title }}
                </h3>

                <span class="text-white/50 text-xs mt-2 opacity-0 group-hover/card:opacity-100 transition-opacity">
                    Ver detalle
                </span>
            </div>
        </div>
        }
    </div>

    <button (click)="scroll('right')"
        class="hidden lg:flex absolute right-4 top-1/2 -translate-y-1/2 z-10 bg-black/40 hover:bg-black/70 backdrop-blur-sm p-3 rounded-full text-white transition-all duration-300 opacity-0 group-hover:opacity-100 shadow-xl">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
    </button>

    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</div>
