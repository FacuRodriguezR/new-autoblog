<div class="bg-azulAs py-12">
    <div class="max-w-6xl mx-auto px-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            <!-- Columna izquierda: Título -->
            <div>
                <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold text-white leading-tight">
                    Suma tu empresa<br />
                    a nuestro club de beneficios.
                </h1>
            </div>

            <!-- Columna derecha: Formulario -->
            <div>
                <form [formGroup]="benefitsForm" (ngSubmit)="onSubmit()" class="space-y-4">
                    <!-- Nombre y Apellido -->
                    <div>
                        <label class="block text-gray-300 text-sm mb-2">
                            Nombre y Apellido*
                        </label>
                        <input type="text" formControlName="nombreApellido"
                            class="w-full px-4 py-3 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-orange-500"
                            [class.border-red-500]="benefitsForm.get('nombreApellido')?.invalid && benefitsForm.get('nombreApellido')?.touched" />
                        <div *ngIf="benefitsForm.get('nombreApellido')?.invalid && benefitsForm.get('nombreApellido')?.touched"
                            class="text-red-400 text-sm mt-1">
                            Este campo es requerido
                        </div>
                    </div>

                    <!-- Correo -->
                    <div>
                        <label class="block text-gray-300 text-sm mb-2">
                            Correo*
                        </label>
                        <input type="email" formControlName="correo"
                            class="w-full px-4 py-3 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-orange-500"
                            [class.border-red-500]="benefitsForm.get('correo')?.invalid && benefitsForm.get('correo')?.touched" />
                        <div *ngIf="benefitsForm.get('correo')?.invalid && benefitsForm.get('correo')?.touched"
                            class="text-red-400 text-sm mt-1">
                            <span *ngIf="benefitsForm.get('correo')?.errors?.['required']">Este campo es
                                requerido</span>
                            <span *ngIf="benefitsForm.get('correo')?.errors?.['email']">Ingrese un correo válido</span>
                        </div>
                    </div>

                    <!-- Empresa -->
                    <div>
                        <label class="block text-gray-300 text-sm mb-2">
                            Empresa*
                        </label>
                        <input type="text" formControlName="empresa"
                            class="w-full px-4 py-3 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-orange-500"
                            [class.border-red-500]="benefitsForm.get('empresa')?.invalid && benefitsForm.get('empresa')?.touched" />
                        <div *ngIf="benefitsForm.get('empresa')?.invalid && benefitsForm.get('empresa')?.touched"
                            class="text-red-400 text-sm mt-1">
                            Este campo es requerido
                        </div>
                    </div>

                    <!-- Mensaje -->
                    <div>
                        <label class="block text-gray-300 text-sm mb-2">
                            Mensaje*
                        </label>
                        <textarea formControlName="mensaje" rows="5" maxlength="200"
                            class="w-full px-4 py-3 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-orange-500 resize-none"
                            [class.border-red-500]="benefitsForm.get('mensaje')?.invalid && benefitsForm.get('mensaje')?.touched"></textarea>
                        <div class="flex justify-between items-center mt-1">
                            <div *ngIf="benefitsForm.get('mensaje')?.invalid && benefitsForm.get('mensaje')?.touched"
                                class="text-red-400 text-sm">
                                Este campo es requerido
                            </div>
                            <div class="text-gray-400 text-sm ml-auto">
                                {{benefitsForm.get('mensaje')?.value?.length || 0}}/200
                            </div>
                        </div>
                    </div>

                    <!-- Botón de envío -->
                    <div class="text-center pt-4">
                        <button type="submit" [disabled]="benefitsForm.invalid"
                            class="bg-naranjaAs hover:bg-orange-700 text-white font-bold py-3 px-8 rounded-md text-lg transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                            Quiero sumarme
                        </button>
                    </div>
                </form>
            </div>
        </div>
