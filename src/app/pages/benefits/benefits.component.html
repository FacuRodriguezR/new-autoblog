<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 p-6">
    @for(sponsor of sponsors; track $index) {
    <div (click)="openBenefits(sponsor)" class="group relative bg-white rounded-2xl border border-gray-100 p-6 
                shadow-sm hover:shadow-xl transition-all duration-300 
                flex flex-col items-center justify-center cursor-pointer 
                hover:-translate-y-1">

        <div class="h-24 w-full flex items-center justify-center">
            <img [src]="sponsor.image" [alt]="sponsor.name"
                class="max-h-full max-w-full object-contain grayscale group-hover:grayscale-0 transition-all duration-500" />
        </div>

        <div
            class="mt-4 flex items-center gap-1 text-gray-400 group-hover:text-[#e5630d] transition-colors duration-300">
            <span class="text-xs font-medium uppercase tracking-wider">Ver beneficios</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </div>

        <div
            class="absolute bottom-0 left-0 w-full h-1 bg-[#e5630d] scale-x-0 group-hover:scale-x-100 transition-transform duration-300 rounded-b-2xl">
        </div>
    </div>
    }
</div>

<dialog id="benefits_modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box p-0 bg-neutral-900 border border-gray-700 shadow-2xl max-w-4xl overflow-hidden relative">

        <div class="absolute inset-0 opacity-10 pointer-events-none"
            style="background-image: radial-gradient(#fff 0.5px, transparent 0.5px); background-size: 24px 24px;">
        </div>

        <div class="relative p-8">
            <div class="flex flex-col items-center mb-10">
                <div class="bg-white p-4 rounded-xl shadow-lg mb-4 h-28 w-48 flex items-center justify-center">
                    <img [src]="currentSponsor?.image" [alt]="currentSponsor?.name"
                        class="max-h-full max-w-full object-contain" />
                </div>

                <h3 class="text-xl font-bold text-[#e5630d] uppercase tracking-widest text-center">
                    Beneficios en {{ currentSponsor?.name }}
                </h3>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
                @for(benefit of beneficios; track $index) {
                <div class="flex flex-col items-center text-center group">
                    <span
                        class="text-4xl font-black text-[#e5630d] mb-2 group-hover:scale-110 transition-transform duration-300">
                        {{ benefit.percentage }}% OFF
                    </span>
                    <p class="text-gray-300 text-[10px] font-bold uppercase leading-tight px-2 tracking-tighter">
                        {{ benefit.description }}
                    </p>
                </div>
                }
            </div>

            <p
                class="mt-12 text-[16px] font-medium text-gray-500 text-center uppercase tracking-widest border-t border-gray-800 pt-6">
                Beneficios exclusivos para socios y personal de la empresa.
            </p>
        </div>

        <div class="modal-action p-4 bg-black/20">
            <form method="dialog">
                <button
                    class="btn bg-[#e5630d] hover:bg-[#c4540a] border-none text-white px-8 rounded-lg uppercase font-bold">
                    Cerrar
                </button>
            </form>
        </div>
    </div>

    <form method="dialog" class="modal-backdrop bg-black/80 backdrop-blur-sm">
        <button>close</button>
    </form>
</dialog>
