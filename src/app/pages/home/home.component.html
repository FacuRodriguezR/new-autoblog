<app-carousel-home [eventsInput]="carouselEvents"></app-carousel-home>
<div class="container-main">
    <div class="mt-5">
        <h2 class="text-2xl text-azulAs mx-4">Consejos útiles</h2>
        <app-carousel-notes [notesCarousel]="novedades" [tipoCarousel]="tipoNovedades"></app-carousel-notes>
    </div>
    <div class="mt-5">
        <h2 class="text-2xl text-azulAs mx-4">Promociones & Beneficios</h2>
        <app-carousel-brands [brands]="colaboradores"></app-carousel-brands>

    </div>
    <div class="flex justify-center m-4">
        <div class="card bg-base-100 image-full w-full shadow-sm rounded-xl overflow-hidden h-60 md:h-150">
            <figure>
                <img src="/assets/images/eventos/wineexpo2025/we2025-1.jpeg" alt="Eventos"
                    class="w-full h-full object-cover" />
            </figure>
            <div class="card-body items-center justify-center p-0">
                <h2 class="card-title text-4xl font-bold text-white tracking-tight">EVENTOS</h2>
            </div>
        </div>
    </div>

    <div class="mt-5">
        <h2 class="text-2xl text-azulAs mx-4">Últimos eventos</h2>
        <app-carousel-notes [notesCarousel]="events" [tipoCarousel]="tipoEvent"></app-carousel-notes>
    </div>



    <!-- <div class="mt-5">
        <app-form-benefit></app-form-benefit>
    </div> -->
</div>
